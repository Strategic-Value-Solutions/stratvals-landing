name: Build Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtppro.zoho.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || 'suresh.a@stratvals.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || 'test-build-password' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'suresh.a@stratvals.com' }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO || 'contact@stratvals.com' }}
